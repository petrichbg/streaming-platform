name: CI

on:
  push:
    branches: [master, "codex/**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, build and Prisma validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            web/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate and validate Prisma client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://streaming:changeme@127.0.0.1:5432/streaming
        run: |
          npx prisma generate
          npx prisma validate

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck web
        working-directory: web
        run: npm run typecheck

      - name: Lint web
        working-directory: web
        run: npm run lint

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Assemble production build artifact
        shell: bash
        run: |
          mkdir -p production-artifact/backend production-artifact/web/.next
          cp -R backend/dist backend/prisma production-artifact/backend/
          cp backend/package.json backend/package-lock.json production-artifact/backend/
          cp -R web/.next/standalone/. production-artifact/web/
          cp -R web/.next/static production-artifact/web/.next/static
          cp web/package.json web/package-lock.json production-artifact/web/
          printf 'commit=%s\nbuilt_at=%s\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > production-artifact/BUILD_INFO
          tar -czf streaming-platform-production.tar.gz production-artifact
          sha256sum streaming-platform-production.tar.gz > streaming-platform-production.tar.gz.sha256

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: streaming-platform-production-${{ github.sha }}
          path: |
            streaming-platform-production.tar.gz
            streaming-platform-production.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  dependency-security:
    name: Dependency security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            web/package-lock.json

      - name: Audit backend production dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Audit web production dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  integration:
    name: Migrations, integration and security
    runs-on: ubuntu-latest
    env:
      DOMAIN: streaming.local
      POSTGRES_USER: streaming
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: streaming
      REDIS_PASSWORD: changeme
      DATABASE_URL: postgresql://streaming:changeme@127.0.0.1:5432/streaming
      REDIS_URL: redis://:changeme@127.0.0.1:6379
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      MEDIA_ROOT: /tmp/streaming-media
      POSTER_ROOT: /tmp/streaming-posters
      TRANSCODE_OUTPUT_ROOT: /tmp/streaming-transcoded
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Prepare test environment
        run: |
          cp .env.example .env
          mkdir -p /tmp/streaming-media /tmp/streaming-posters /tmp/streaming-transcoded
          docker compose up -d postgres redis

      - name: Install and build backend
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run build

      - name: Start backend
        working-directory: backend
        run: |
          npm run start:prod > ../backend-ci.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat ../backend-ci.log
          exit 1

      - name: Run security checks
        working-directory: backend
        run: npm run test:security

      - name: Run integration suite
        working-directory: backend
        shell: pwsh
        run: ../scripts/integration-test.ps1

      - name: Print diagnostics on failure
        if: failure()
        run: |
          cat backend-ci.log || true
          docker compose logs postgres redis || true

      - name: Stop test services
        if: always()
        run: docker compose down --volumes

  quality-gate:
    name: Quality gate
    if: always()
    needs: [build, dependency-security, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to succeed
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-security.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$DEPENDENCY_RESULT" = success
          test "$INTEGRATION_RESULT" = success
